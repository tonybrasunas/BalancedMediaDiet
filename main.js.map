<a name="{{ diet?.title }}"></a>

<div id="{{ diet?.title }}"
    class="diet-container">

  <div class="diet-title">
    <div class="titles">
      <div class="collapser-triangle"
          (click)="toggleDisplay()"
          [class]="isDisplayed ? 'arrow-down' : 'arrow-right'">
      </div>
      <h1 class="text-bmd-red margin-bottom-0px">{{ diet?.title }}</h1>
      <h2 class="text-bmd-blue">"{{ diet?.subtitle }}"</h2>
    </div>
    <div class="diet-time">
      [ {{ diet?.time}} ]
    </div>
  </div>
  <!-- <button (click)="newNewsSource()"
        mat-button>
      <mat-icon>add</mat-icon> Add Source
    </button> -->

  @if (isDisplayed) {

  <section class="grid-headers desktop-only">
    <h3></h3>
    <h3>Sunday</h3>
    <h3>Monday</h3>
    <h3>Tuesday</h3>
    <h3>Wednesday</h3>
    <h3>Thursday</h3>
    <h3>Friday</h3>
    <h3>Saturday</h3>
  </section>


  <section class="grid-diets">
    <div class="diet-description small-text margin-right-15px">
      <em [innerHTML]="diet?.description"></em>
    </div>
    <div *ngFor="let day of diet?.dietDays"
        class="outer-tile">
      <h2 class="mobile-only">{{ day?.name }}</h2>
      <div class="inner-grid">
        <grid-spot *ngFor="let newsSourceId of day?.newsSourceIds"
            [newsSourceId]="newsSourceId">
        </grid-spot>
      </div>
    </div>
  </section>
  }

</div>
