<div class="news-source-inner">
  <img class="bmd-nameplate"
      src="../../assets/main_nameplate-Balanced-Media-Diet.png" />
  <h1 class="text-bmd-red">{{ newsOrg.name }}</h1>
  <img alt="Media Source - {{ newsOrg.name }}"
      class="media-source-logo"
      src="../../assets/news-sources/{{ newsOrg.imageName }}" />
  <p [innerHTML]="newsOrg.description"></p>
  <span class="foodgroup">
    <strong>Media Food Group:</strong> {{ newsOrg.foodGroup }}
  </span>
  <span class="viewpoint">
    <strong>Viewpoint:</strong> {{ newsOrg.viewpoint }}
  </span>
  <a *ngIf="newsOrg.linkToRead"
      href="{{ newsOrg.linkToRead }}"
      target="_blank">
    <h2 class="visit-link">Read ></h2>
  </a>
  <a *ngIf="newsOrg.linkToWatch"
      href="{{ newsOrg.linkToWatch }}"
      target="_blank">
    <h2 class="visit-link">Watch ></h2>
  </a>
  <a *ngIf="newsOrg.linkToListen"
      href="{{ newsOrg.linkToListen }}"
      target="_blank">
    <h2 class="visit-link">Listen ></h2>
  </a>
</div>
