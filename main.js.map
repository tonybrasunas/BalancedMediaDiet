<div class="logo pointer"
    (click)="scroll('home-header')">
  <a routerLink="home">
    <img src="../assets/main_nameplate-Balanced-Media-Diet.png">
  </a>
</div>


<ul nz-menu
    nzMode="horizontal">

  <li nz-menu-item
      *ngFor="let diet of primaryDiets">
    <a routerLink="home"
        (click)="gotoDiet(diet.title)">
      {{ diet.title }}
    </a>
  </li>

  <li nz-menu-item
      (click)="scroll('the-book')"
      routerLink="home"
      class="bmd-button button-the-book">The Book</li>

  <div *ngIf="userFeatureFlag"
      class="user-profile-icon"
      (click)="openProfileModal()">
    <ng-container *ngIf="isLoggedIn$ | async; else loggedOut">
      <img src="../../assets/user-blue.svg">
      <span class="auth-dot auth-dot--in"></span>
      <span class="user-label">{{ userDisplayName$ | async }}</span>
    </ng-container>
    <ng-template #loggedOut>
      <img src="../../assets/user-blue.svg">
      <span class="user-label">Sign In</span>
    </ng-template>
  </div>


</ul>
