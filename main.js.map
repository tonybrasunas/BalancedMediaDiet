<div id="diet-create">
  <h1 class="text-bmd-blue">Create a New Diet</h1>
  <p class="section-subtitle">Define a weekly media diet by filling in the details and selecting
    news sources for each day.</p>

  <form (ngSubmit)="saveDiet()">

    <!-- Basic Info -->
    <div class="form-section">
      <h2 class="text-bmd-blue">Diet Info</h2>

      <div class="form-row">
        <div class="form-field">
          <label>Title <span class="required">*</span></label>
          <input nz-input
              [(ngModel)]="title"
              name="title"
              placeholder="e.g. Basic" />
        </div>

        <div class="form-field">
          <label>Subtitle</label>
          <input nz-input
              [(ngModel)]="subtitle"
              name="subtitle"
              placeholder="e.g. Conscious Citizen" />
        </div>

        <div class="form-field form-field--narrow">
          <label>Year</label>
          <nz-input-number [(ngModel)]="year"
              name="year"
              [nzMin]="2000"
              [nzMax]="2100"
              [nzStep]="1"></nz-input-number>
        </div>
      </div>

      <div class="form-field form-field--full">
        <label>Description <span class="required">*</span></label>
        <textarea nz-input
            [(ngModel)]="description"
            name="description"
            placeholder="Describe this diet and how to use it…"
            [nzAutosize]="{ minRows: 3, maxRows: 6 }"></textarea>
      </div>
    </div>

    <!-- Weekly Schedule -->
    <div class="form-section">
      <h2 class="text-bmd-blue">Weekly Schedule</h2>
      <p class="section-hint">Select one or more news sources for each day of the week.</p>

      <div class="day-row"
          *ngFor="let weekday of weekdays; trackBy: trackByDay">
        <div class="day-label">
          <span class="day-name">{{ weekday.name }}</span>
        </div>
        <div class="day-sources">
          <nz-select
              [ngModel]="weekday.selectedSourceIds"
              (ngModelChange)="onSourcesChange(weekday, $event)"
              [ngModelOptions]="{ standalone: true }"
              nzMode="multiple"
              nzPlaceHolder="Select sources for {{ weekday.name }}"
              [nzShowArrow]="true"
              [nzMaxTagCount]="4"
              style="width: 100%">
            <nz-option *ngFor="let source of newsSources"
                [nzValue]="source.id"
                [nzLabel]="source.name + ' — ' + source.foodGroup"></nz-option>
          </nz-select>
        </div>
      </div>
    </div>

    <!-- Save -->
    <div class="form-actions">
      <button nz-button
          nzType="primary"
          nzSize="large"
          [disabled]="!isFormValid || isSaving"
          [nzLoading]="isSaving">
        Save Diet
      </button>
      <p *ngIf="!isFormValid"
          class="validation-hint">Title and description are required.</p>
    </div>

  </form>
</div>
